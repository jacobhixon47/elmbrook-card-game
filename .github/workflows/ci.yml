name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm sim --runs 300 --strategy greedy
      - run: pnpm sim --runs 100 --strategy random
      - run: pnpm art:check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm snap:all
      - run: pnpm e2e
        env:
          TRACE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snaps
          path: .snaps/
          include-hidden-files: true
