name: Desktop
# Tauri builds for Windows, Mac and Linux (docs/milestones.md, M6): run it from the Actions tab, or
# push a v* tag. Each build is a workflow artifact, the private download link for friends.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --bundles nsis
            bundle: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin --bundles dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: linux
            args: --bundles appimage,deb
            bundle: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: elmbrook-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
